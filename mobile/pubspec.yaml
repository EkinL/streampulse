name: streampulse
description: A real-time audio streaming application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  dio: ^5.4.0
  go_router: ^14.0.0
  flutter_secure_storage: ^9.0.0
  just_audio: ^0.9.36
  flutter_sound: ^9.16.0
  audio_session: ^0.1.25
  audio_service: ^0.18.19 # lecture en arriere-plan + controles systeme
  json_annotation: ^4.8.0
  freezed_annotation: ^2.4.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  google_fonts: ^8.2.1
  connectivity_plus: ^6.0.0
  shared_preferences: ^2.2.0
  intl: ^0.19.0
  flutter_svg: ^2.0.0
  record: ^5.2.0

dependency_overrides:
  record_linux: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  freezed: ^2.4.0
  riverpod_generator: ^2.3.0
  mocktail: ^1.0.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
