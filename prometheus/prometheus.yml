global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "streampulse-api"
    static_configs:
      # Internal metrics listener (METRICS_PORT). The public /metrics
      # route on :8080 requires an admin JWT.
      - targets: ["api:9091"]
    metrics_path: /metrics

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]
