name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          working-directory: backend

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Valide la description elle-meme. Sa correspondance avec les routes
      # reellement servies est verifiee par le job `test`
      # (TestOpenAPICoversEveryRoute).
      - name: Lint OpenAPI description
        working-directory: backend
        run: npx --yes @redocly/cli@1.25.11 lint api/openapi.yaml
      # Document autoportant, publie comme livrable de la PR.
      - name: Bundle OpenAPI description
        working-directory: backend
        run: npx --yes @redocly/cli@1.25.11 bundle api/openapi.yaml -o openapi.bundled.yaml
      - name: Upload OpenAPI description
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: |
            backend/api/openapi.yaml
            backend/openapi.bundled.yaml

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: streampulse_test
          POSTGRES_USER: streampulse
          POSTGRES_PASSWORD: streampulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://streampulse:streampulse@localhost:5432/streampulse_test?sslmode=disable
          JWT_SECRET: test-secret
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.out

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, openapi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build
        working-directory: backend
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/server ./cmd/server

  docker:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        working-directory: backend
        run: docker build -t streampulse-api:${{ github.ref_name }} .
