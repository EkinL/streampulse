              example:
                data: { status: removed }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '400': { $ref: '#/components/responses/InvalidID' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /search:
    get:
      tags: [music]
      operationId: globalSearch
      summary: Search streams and tracks at once
      description: |
        Tracks are matched with PostgreSQL full-text search (first 20 hits).
        Streams are matched with a case-insensitive substring match on the
        title, over the first 100 streams only — the query is not pushed down
        to the database yet.
      parameters:
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: Search results.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SearchResult' }
        '400':
          description: Missing `q`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /favorites:
