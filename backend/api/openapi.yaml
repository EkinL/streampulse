                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message: { type: string, const: music deleted }
        '400': { $ref: '#/components/responses/InvalidID' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /music/{id}/favorite:
    parameters:
