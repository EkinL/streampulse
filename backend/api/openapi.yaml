openapi: 3.1.0

info:
  title: StreamPulse API
  version: 1.0.0
  summary: Real-time audio streaming platform.
  description: |
    REST + SSE API of the StreamPulse platform (Go 1.26, chi router).

    ## Response envelope

    Every JSON response produced by a handler is wrapped:

    ```json
    { "data": { }, "meta": { "requestId": "uuid", "timestamp": "RFC3339" } }
    ```

    List endpoints add `page`, `perPage` and `total` to `meta`.
    Errors replace `data` with `error: { code, message }`.

    ## Correlating a response with the logs

    Every response carries an `X-Request-Id` header, and `meta.requestId`
    repeats it. The same value is emitted as `request_id` on the server's
    structured log line for that request, alongside the OpenTelemetry
    `trace_id`. Quote it in a bug report and the request can be found in the
    logs and in the trace.

    The header is the more reliable of the two: it is present even on the
    middleware errors described below, which have no `meta` envelope.

    ## Roles

    Roles are ordered: `anonymous` < `user` < `broadcaster` < `admin`.
    An endpoint marked "broadcaster" is therefore also reachable by an admin.

    ## Personal data

    `GET /users/me` returns every piece of personal data held on the
    calling account; `PATCH /users/me` rectifies its email or username;
    `DELETE /users/me` erases the account and everything attached to it
    (tokens, streams, playlists, favorites, uploaded tracks). An admin can
    delete an account on behalf of a user with `DELETE /admin/users/{id}`.
    Retention rules and the security measures behind them are in
    `docs/rgpd.md`.

    ## Known inconsistency

    `401`, `403` and `429` raised by the middleware chain (authentication,
    RBAC, rate limiting) are written with `http.Error`: the body is the
    `error` object alone, without the `meta` envelope, and the
    `Content-Type` is `text/plain; charset=utf-8`. Errors raised inside a
    handler always use the JSON envelope. Both shapes are documented on
    each operation. Those responses still carry `X-Request-Id`, so they
    remain correlatable.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local development (docker compose up)
  - url: '{scheme}://{host}'
    description: Any deployment
    variables:
      scheme:
        default: https
        enum: [http, https]
      host:
        default: api.streampulse.local

tags:
  - name: system
    description: Health, metrics and API description.
  - name: auth
    description: Registration, login and token rotation.
  - name: streams
    description: Live stream catalogue and playback.
  - name: broadcast
    description: Stream lifecycle and audio ingest, broadcaster only.
  - name: music
    description: On-demand music catalogue and search.
  - name: favorites
    description: Per-user favorite streams and tracks.
  - name: playlists
    description: Playlist CRUD and queue ordering.
  - name: users
    description: The calling user's own account — data access and erasure.
  - name: admin
    description: User administration, admin only.
  - name: feedback
    description: |
      User feedback channel: any authenticated account can report a bug or
      a suggestion; an admin lists and processes what comes in.

security: []

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness probe
      description: Always public. Used by the Docker HEALTHCHECK and by the CI smoke test.
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            const: ok
              example:
                data: { status: ok }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /openapi.yaml:
    get:
      tags: [system]
      operationId: getOpenAPISpec
      summary: This document
      description: Serves the OpenAPI description embedded in the binary, so it can never drift from the deployed build.
      responses:
        '200':
          description: The OpenAPI 3.1 document.
          content:
            application/yaml:
              schema:
                type: string
        '429': { $ref: '#/components/responses/RateLimited' }

  /docs:
    get:
      tags: [system]
      operationId: getDocsUI
      summary: Swagger UI
      description: |
        HTML page rendering `/openapi.yaml` with Swagger UI. The renderer is
        loaded from a public CDN, so this page needs internet access; the
        machine-readable spec at `/openapi.yaml` never does.
      responses:
        '200':
          description: HTML documentation page.
          content:
            text/html:
              schema:
                type: string
        '429': { $ref: '#/components/responses/RateLimited' }

  /metrics:
    get:
      tags: [system]
      operationId: getMetrics
      summary: Prometheus metrics
      description: |
        Prometheus exposition format. Restricted to `admin`.

        Prometheus itself does not scrape this route: it scrapes the
        unauthenticated internal listener bound to `METRICS_PORT` (9091),
        which is only reachable from the Docker network.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Metrics in Prometheus text format.
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP active_streams Number of streams currently live
                # TYPE active_streams gauge
                active_streams 3
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/MiddlewareForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /uploads/{filepath}:
    get:
      tags: [system]
      operationId: getUpload
      summary: Uploaded audio file
      description: Static file server over the upload directory. URLs are handed back by `POST /music`.
      parameters:
        - name: filepath
          in: path
          required: true
          description: Path of the stored file, relative to the upload root.
          schema:
            type: string
          example: 2026/08/9f1c-track.mp3
      responses:
        '200':
          description: The file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: No such file.

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account
      description: Creates a `user` account and returns a token pair straight away — no confirmation step.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created, session opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email already registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: CONFLICT, message: email already registered }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Open a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Wrong email or password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: UNAUTHORIZED, message: invalid credentials }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/oauth:
    post:
      tags: [auth]
      operationId: oauthLogin
      summary: Open a session with Google or Apple
      description: |
        Social login. The mobile app obtains an ID token from the provider's
        SDK (Google Sign-In or Sign in with Apple) and posts it here. The
        server verifies its signature against the provider's JWKS, its issuer
        and its audience (`GOOGLE_OAUTH_CLIENT_IDS` / `APPLE_OAUTH_CLIENT_IDS`),
        then opens a session. First sign-in creates a `user` account, or links
        the identity to the existing account bearing the same verified email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthLoginRequest'
      responses:
        '200':
          description: Session opened (account created on first sign-in).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Identity token rejected (bad signature, issuer, audience, or expired).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: UNAUTHORIZED, message: invalid identity token }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '409':
          description: Email already registered but not verified by the provider, so it cannot be linked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: CONFLICT, message: email already registered with a password account }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: The requested provider has no client ID configured on this server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: SERVICE_UNAVAILABLE, message: social login is not configured on this server }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Rotate the token pair
      description: |
        Exchanges a refresh token for a fresh pair. The presented refresh
        token is consumed: rotation is one-shot, replaying it returns 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Refresh token unknown, already used, or expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: UNAUTHORIZED, message: invalid or expired refresh token }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /streams:
    get:
      tags: [streams]
      operationId: listStreams
      summary: List streams
      description: Public catalogue. Anonymous visitors may browse, but not listen.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Page of streams.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamListEnvelope'
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [broadcast]
      operationId: createStream
      summary: Create a stream
      description: Creates the stream in `idle` state. Requires the `broadcaster` role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStreamRequest'
      responses:
        '201':
          description: Stream created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/MiddlewareForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /streams/{id}:
    parameters:
      - $ref: '#/components/parameters/StreamID'
    get:
      tags: [streams]
      operationId: getStream
      summary: Get a stream
      responses:
        '200':
          description: The stream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamEnvelope'
        '400': { $ref: '#/components/responses/InvalidID' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [broadcast]
      operationId: updateStream
      summary: Rename a stream
      description: Title and description only. Owner-only, on top of the `broadcaster` role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStreamRequest'
      responses:
        '200':
          description: Stream updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /streams/{id}/listen:
    parameters:
      - $ref: '#/components/parameters/StreamID'
    get:
      tags: [streams]
      operationId: listenStream
      summary: Listen over SSE
      description: |
        Server-Sent Events channel. The first frame is an `event: connected`
        control frame; every following frame carries one **base64-encoded**
        audio chunk in its `data:` field.

        The connection is long-lived and has no server-side write timeout.
        Registering here increments `active_listeners`; closing it increments
        `stream_disconnections_total`.

        Prefer `/streams/{id}/audio` for a native audio player — the base64
        framing here exists for clients that can only consume SSE.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: SSE stream opened.
          headers:
            Cache-Control:
              schema: { type: string, const: no-cache }
            X-Accel-Buffering:
              schema: { type: string, const: 'no' }
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: connected
                data: {"status":"connected","stream_id":"3f6c…"}

                data: SUQzBAAAAAAAI1RTU0UAAAAP…
        '400':
          description: Invalid id, or the stream is not live.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                notLive:
                  value:
                    error: { code: STREAM_NOT_LIVE, message: stream is not currently live }
                    meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
                invalidID:
                  value:
                    error: { code: BAD_REQUEST, message: invalid stream id }
                    meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /streams/{id}/audio:
    parameters:
      - $ref: '#/components/parameters/StreamID'
    get:
      tags: [streams]
      operationId: listenStreamRaw
      summary: Listen as a raw audio stream
      description: |
        Same fan-out as `/listen`, without the SSE framing: the response body
        is a chunked stream of raw audio bytes, feedable directly to a native
        player (`just_audio` on the mobile app).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Audio stream opened.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid id, or the stream is not live.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /streams/{id}/chat/ws:
    parameters:
      - $ref: '#/components/parameters/StreamID'
    get:
      tags: [streams]
      operationId: streamChatWebSocket
      summary: Join the live chat room (WebSocket)
      description: |
        Upgrades the connection to a **WebSocket** and joins the chat room of
        a live stream — one ephemeral room per live, gone when the live ends.

        Browser WebSocket handshakes cannot carry an `Authorization` header,
        so the access token is also accepted as a `?token=` query parameter;
        native clients should keep the standard `Bearer` header.

        On join, the server first replays the room history (last 50 messages),
        then delivers events as they happen. Every server frame is one JSON
        `ChatMessage`; its `type` is `message`, `user_joined` or `user_left`.
        The client only ever sends `{"text": "..."}` (at most 500 characters);
        identity and timestamps are set server-side from the token claims.

        When the broadcaster stops the stream, the room is closed and every
        participant receives a close frame (going away, "stream ended").
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: query
          required: false
          description: Access token fallback for browser WebSocket clients.
          schema: { type: string }
      responses:
        '101':
          description: Connection upgraded to WebSocket.
        '400':
          description: Invalid id, the stream is not live, or the handshake is not a WebSocket upgrade.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                notLive:
                  value:
                    error: { code: STREAM_NOT_LIVE, message: stream is not currently live }
                    meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /streams/{id}/listeners:
    parameters:
      - $ref: '#/components/parameters/StreamID'
    get:
      tags: [streams]
      operationId: getStreamListeners
      summary: Who is listening right now
      description: Live snapshot read from the in-memory hub. An unknown stream id yields an empty list, not a 404.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current listeners.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [listeners, count]
                        properties:
                          listeners:
                            type: array
                            items: { $ref: '#/components/schemas/ListenerInfo' }
                          count:
                            type: integer
        '400': { $ref: '#/components/responses/InvalidID' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /streams/{id}/start:
    parameters:
      - $ref: '#/components/parameters/StreamID'
    post:
      tags: [broadcast]
      operationId: startStream
      summary: Go live
      description: Moves the stream to `live` so listeners may connect. Owner-only.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Stream is live.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEnvelope' }
              example:
                data: { status: live }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '400': { $ref: '#/components/responses/InvalidID' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '409':
          description: Stream is already live.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: CONFLICT, message: stream is already live }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /streams/{id}/stop:
    parameters:
      - $ref: '#/components/parameters/StreamID'
    post:
      tags: [broadcast]
      operationId: stopStream
      summary: End the broadcast
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Stream stopped.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEnvelope' }
              example:
                data: { status: stopped }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '400': { $ref: '#/components/responses/InvalidID' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /streams/{id}/broadcast:
    parameters:
      - $ref: '#/components/parameters/StreamID'
    post:
      tags: [broadcast]
      operationId: broadcastStream
      summary: Push audio into a live stream
      description: |
        Long-lived upload. The body is read in 4 KiB chunks and each chunk is
        fanned out to every connected listener; the request stays open for the
        whole broadcast. The stream must already be `live`
        (`POST /streams/{id}/start`) and the caller must own it.

        This request is the broadcaster's liveness signal: if it ends and no
        new one replaces it within `BROADCAST_GRACE_PERIOD` (10 s by
        default), the stream is stopped as if `POST /streams/{id}/stop` had
        been called. Streams still `live` when the server starts are ended
        the same way.

        No response body is written: the connection is the transport.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Continuous audio byte stream.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Broadcaster disconnected, stream closed cleanly. Empty body.
        '400':
          description: Invalid id, or the stream was never started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: STREAM_NOT_LIVE, message: stream must be started first }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /streams/{id}/broadcast/ws:
    parameters:
      - $ref: '#/components/parameters/StreamID'
    get:
      tags: [broadcast]
      operationId: broadcastStreamWebSocket
      summary: Push audio into a live stream (WebSocket)
      description: |
        Same ingest as `POST /streams/{id}/broadcast`, over a **WebSocket**:
        every binary frame is one audio chunk, fanned out as-is to every
        connected listener. Text frames are ignored. Frames are capped at
        64 KiB.

        This is the path the web console uses: a browser cannot stream a
        request body (XMLHttpRequest buffers it until the upload ends), so
        the chunked POST only works from native clients.

        Browser WebSocket handshakes cannot carry an `Authorization` header,
        so the access token is also accepted as a `?token=` query parameter.
        The stream must already be `live` and the caller must own it. Like
        the POST, the open connection is the broadcaster's liveness signal:
        closed without a replacement within `BROADCAST_GRACE_PERIOD`, the
        stream is stopped.
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: query
          required: false
          description: Access token fallback for browser WebSocket clients.
          schema: { type: string }
      responses:
        '101':
          description: Connection upgraded to WebSocket; send binary audio frames.
        '400':
          description: Invalid id, the stream was never started, or the handshake is not a WebSocket upgrade.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: STREAM_NOT_LIVE, message: stream must be started first }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /music:
    get:
      tags: [music]
      operationId: listMusic
      summary: List the music catalogue
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Page of tracks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicListEnvelope'
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [music]
      operationId: addMusic
      summary: Add a track
      description: |
        Two shapes, picked from the `Content-Type`:

        - `application/json` — register a track already hosted elsewhere, by URL.
        - `multipart/form-data` — upload the audio file itself (32 MiB parse
          limit); the server stores it and returns the resulting `/uploads/…` URL.

        Requires the `broadcaster` role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMusicURLRequest'
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The audio file.
                title:
                  type: string
                artist:
                  type: string
                album:
                  type: string
                duration:
                  type: string
                  description: Duration in seconds, sent as a form value.
      responses:
        '201':
          description: Track added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicEnvelope'
        '400':
          description: Malformed body, unparseable multipart form, or missing `file` field.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                missingFile:
                  value:
                    error: { code: INVALID_BODY, message: file field is required }
                    meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
                invalidInput:
                  value:
                    error: { code: INVALID_INPUT, message: title is required }
                    meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/MiddlewareForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /music/search:
    get:
      tags: [music]
      operationId: searchMusic
      summary: Full-text search over tracks
      description: PostgreSQL full-text search on title, artist and album.
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Page of matching tracks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicListEnvelope'
        '400':
          description: Missing `q`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: INVALID_INPUT, message: query parameter q is required }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /music/favorites:
