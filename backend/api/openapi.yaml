        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /music/{id}:
    parameters:
      - $ref: '#/components/parameters/MusicID'
    get:
      tags: [music]
      operationId: getMusic
      summary: Get a track
      responses:
        '200':
