          description: Playlist created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /playlists/public:
    get:
      tags: [playlists]
      operationId: listPublicPlaylists
      summary: List public playlists from every user
      description: |
        Playlists with `is_public = true`, from any owner, most recent first.
        Each item carries `owner_username` so the client can show who created
        it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Page of public playlists.
          content:
