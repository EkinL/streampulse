              schema:
                $ref: '#/components/schemas/PlaylistListEnvelope'
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /playlists/{id}:
    parameters:
      - $ref: '#/components/parameters/PlaylistID'
    get:
      tags: [playlists]
      operationId: getPlaylist
      summary: Get a playlist with its tracks
      description: |
        Readable by the owner, or by anyone authenticated if the playlist is
        public. Tracks come back ordered by `position`.

        A private playlist owned by someone else answers `404`, not `403`, on
        purpose: a `403` would confirm that the id exists.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The playlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistEnvelope'
        '400': { $ref: '#/components/responses/InvalidID' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [playlists]
      operationId: updatePlaylist
      summary: Rename a playlist or flip its visibility
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaylistRequest'
      responses:
        '200':
          description: Playlist updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [playlists]
      operationId: deletePlaylist
      summary: Delete a playlist
      description: Cascades to its tracks.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Playlist deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEnvelope' }
              example:
                data: { status: deleted }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '400': { $ref: '#/components/responses/InvalidID' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /playlists/{id}/tracks:
    parameters:
      - $ref: '#/components/parameters/PlaylistID'
    post:
      tags: [playlists]
      operationId: addPlaylistTrack
      summary: Append a track to the queue
      description: The new track lands at the end; its `position` is assigned by the server.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTrackRequest'
      responses:
        '201':
          description: Track appended.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Track' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [playlists]
      operationId: reorderPlaylistTracks
      summary: Reorder the queue
      description: |
        Rewrites the whole ordering in one transaction. `track_ids` must list
        **every** track of the playlist, exactly once, in the desired order —
        a partial or duplicated list is rejected with 400.

        This is what persists the mobile player's queue across devices.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderTracksRequest'
      responses:
        '200':
          description: Queue reordered; the full playlist comes back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistEnvelope'
        '400':
          description: Malformed body, non-UUID track id, or a list that does not match the playlist exactly.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: BAD_REQUEST, message: 'invalid track id: not-a-uuid' }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /playlists/{id}/tracks/{trackId}:
    parameters:
      - $ref: '#/components/parameters/PlaylistID'
      - name: trackId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [playlists]
      operationId: removePlaylistTrack
      summary: Remove a track from the queue
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Track removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEnvelope' }
              example:
                data: { status: removed }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '400': { $ref: '#/components/responses/InvalidID' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/NotOwner' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /users/me:
    get:
      tags: [users]
      operationId: getMe
      summary: Read my account
      description: |
        Every piece of personal data held on the calling account, read from
        the database rather than from the token. Right of access (GDPR
        art. 15) and portability (art. 20): the JSON is the export.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The calling user's account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '404':
          description: The account no longer exists (deleted while the token was still valid).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: NOT_FOUND, message: user not found }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [users]
      operationId: updateMe
      summary: Rectify my email or username
      description: |
        Right of rectification (GDPR art. 16). Both fields are required and
        replace the current value; there is no partial rename of just one
        letter without resending the other field. Email uniqueness is
        enforced the same way as at registration.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '404':
          description: The account no longer exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: NOT_FOUND, message: user not found }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '409':
          description: Email already used by another account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: CONFLICT, message: email already registered }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [users]
      operationId: deleteMe
      summary: Delete my account
      description: |
        Erases the calling account and, by database cascade, everything
        attached to it: refresh tokens, streams, playlists, favorites and
        uploaded tracks. Right to erasure (GDPR art. 17). Irreversible.

        The access token presented remains cryptographically valid until
        it expires (15 minutes by default) but no longer matches any
        account: `GET /users/me` answers 404 and the refresh token is gone.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEnvelope' }
              example:
                data: { status: deleted }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '404':
          description: The account was already deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: NOT_FOUND, message: user not found }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: List every user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListEnvelope'
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/MiddlewareForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [admin]
      operationId: deleteUser
      summary: Delete a user's account
      description: |
        Same effect as `DELETE /users/me`, performed by an admin on behalf
        of the user — for an erasure request received outside the app.
        Irreversible. No self-deletion guard: an admin deleting their own
        id gets the same result as `DELETE /users/me`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEnvelope' }
              example:
                data: { status: deleted }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '400':
          description: Invalid user id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: BAD_REQUEST, message: invalid user id }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/MiddlewareForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/users/{id}/role:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [admin]
      operationId: updateUserRole
      summary: Change a user's role
      description: |
        Promotes or demotes a user. No self-demotion guard: an admin can
        remove their own admin role and lock themselves out.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: Role updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEnvelope' }
              example:
                data: { status: updated }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '400':
          description: Invalid user id, malformed body, or unknown role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: BAD_REQUEST, message: invalid role }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/MiddlewareForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /feedback:
    post:
      tags: [feedback]
      operationId: submitFeedback
      summary: Report a bug or a suggestion
      description: |
        The user feedback channel: any authenticated account, whatever its
        role, can send a message describing a problem or an idea. It always
        starts in the `new` status; only an admin can move it forward.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitFeedbackRequest'
      responses:
        '201':
          description: Feedback recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/feedback:
    get:
      tags: [admin, feedback]
      operationId: listFeedback
      summary: List reported feedback
      description: |
        Most recent first, optionally filtered by status. This is how the
        team processes what comes in through `POST /feedback`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/FeedbackStatus' }
          description: Restrict the list to this status.
      responses:
        '200':
          description: Page of feedback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackListEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/MiddlewareForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/feedback/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [admin, feedback]
      operationId: updateFeedbackStatus
      summary: Move feedback through its processing status
      description: Typically `new` → `in_progress` → `resolved`, admin only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/FeedbackStatus' }
      responses:
        '200':
          description: Status updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEnvelope' }
              example:
                data: { status: updated }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '400':
          description: Invalid feedback id, malformed body, or unknown status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: BAD_REQUEST, message: invalid status }
                meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/MiddlewareForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <access_token>`, HS256, 15 minutes by default
        (`JWT_EXPIRY`). Claims carry `user_id`, `username` and `role`.
        Renew with `POST /auth/refresh`.

  headers:
    RequestID:
      description: |
        Identifier of this request, generated by the server. Repeated in
        `meta.requestId` when the response has an envelope, and emitted as
        `request_id` on the matching structured log line.
      schema:
        type: string
        example: streampulse/8f1c4a2b0e91/000042

  parameters:
    Page:
      name: page
      in: query
      description: 1-based page number. Anything below 1 falls back to 1.
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      description: Page size. Anything below 1 falls back to 20.
      schema: { type: integer, minimum: 1, default: 20 }
    Query:
      name: q
      in: query
      required: true
      description: Search terms. Required — an empty value is a 400.
      schema: { type: string, minLength: 1 }
    StreamID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MusicID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlaylistID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed body. Unknown JSON fields are rejected.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: BAD_REQUEST, message: invalid request body }
            meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
    InvalidID:
      description: A path parameter is not a valid UUID.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: BAD_REQUEST, message: invalid stream id }
            meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
    NotFound:
      description: No such resource.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: NOT_FOUND, message: stream not found }
            meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
    NotOwner:
      description: Authenticated and correctly roled, but not the owner of this resource.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: FORBIDDEN, message: not the owner of this stream }
            meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
    InternalError:
      description: Unexpected server-side failure.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: INTERNAL_ERROR, message: failed to list streams }
            meta: { requestId: 8f1c…, timestamp: '2026-08-27T10:00:00Z' }
    MiddlewareUnauthorized:
      description: |
        Missing, malformed or expired `Authorization` header. Written by the
        authentication middleware: bare `error` object, `text/plain` content type.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestID'
      content:
        text/plain:
          schema: { $ref: '#/components/schemas/BareError' }
          example:
            error: { code: UNAUTHORIZED, message: invalid or expired token }
    MiddlewareForbidden:
      description: |
        Role below the endpoint's minimum. Written by the RBAC middleware:
        bare `error` object, `text/plain` content type.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestID'
      content:
        text/plain:
          schema: { $ref: '#/components/schemas/BareError' }
          example:
            error: { code: FORBIDDEN, message: insufficient permissions }
    RateLimited:
      description: |
        Per-IP token bucket exhausted (`RATE_LIMIT_RPS`, burst
        `RATE_LIMIT_BURST`). Written by the rate-limit middleware: bare
        `error` object, `text/plain` content type.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestID'
      content:
        text/plain:
          schema: { $ref: '#/components/schemas/BareError' }
          example:
            error: { code: RATE_LIMITED, message: too many requests }

  schemas:

    Meta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
          description: |
            Identifier of the request, identical to the `X-Request-Id`
            response header and to the `request_id` field of the matching
            structured log line. Not a UUID: it is the chi request id, of the
            form `<host>/<random>-<counter>`.
        timestamp:
          type: string
          format: date-time
          description: UTC, RFC 3339.
        page:
          type: integer
          description: Present on list endpoints only.
        perPage:
          type: integer
          description: Present on list endpoints only.
        total:
          type: integer
          description: |
            Total row count, present on list endpoints only. Serialized with
            `omitempty`, so it is **absent** rather than `0` when the result
            set is empty — treat a missing `total` as zero.

    Envelope:
      type: object
      required: [data, meta]
      properties:
        data: true
        meta: { $ref: '#/components/schemas/Meta' }

    ChatMessage:
      type: object
      description: |
        One frame of the live chat WebSocket (`/streams/{id}/chat/ws`).
        `text` is only present when `type` is `message`; presence events
        (`user_joined`, `user_left`) carry the identity fields alone.
      required: [type, id, stream_id, user_id, username, sent_at]
      properties:
        type:
          type: string
          enum: [message, user_joined, user_left]
        id:
          type: string
          format: uuid
        stream_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        username:
          type: string
        text:
          type: string
          maxLength: 500
        sent_at:
          type: string
          format: date-time

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable code.
          enum:
            - BAD_REQUEST
            - INVALID_ID
            - INVALID_BODY
            - INVALID_INPUT
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - STREAM_NOT_LIVE
            - RATE_LIMITED
            - INTERNAL_ERROR
        message:
          type: string
          description: Human-readable, English, not meant to be shown as-is to end users.

    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error: { $ref: '#/components/schemas/Error' }
        meta: { $ref: '#/components/schemas/Meta' }

    BareError:
      type: object
      description: Error shape emitted by the middleware chain, without the `meta` envelope.
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/Error' }

    StatusEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [status]
              properties:
                status: { type: string }

    Role:
      type: string
      description: Ordered from least to most privileged.
      enum: [anonymous, user, broadcaster, admin]

    StreamStatus:
      type: string
      enum: [idle, live, ended]

    User:
      type: object
      required: [id, email, username, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    Profile:
      description: Every piece of personal data held on an account. The password hash is never returned.
      type: object
      required: [id, email, username, role, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_at, user]
      properties:
        access_token:
          type: string
          description: 'JWT HS256. Send it as the `Authorization: Bearer …` header.'
        refresh_token:
          type: string
          description: Opaque, single use, 168 h by default (`JWT_REFRESH_EXPIRY`).
        expires_at:
          type: string
          format: date-time
          description: Expiry of the access token, not of the refresh token.
        user: { $ref: '#/components/schemas/User' }

    RegisterRequest:
      type: object
      required: [email, username, password]
      properties:
        email: { type: string, format: email }
        username: { type: string }
        password:
          type: string
          format: password
          description: Hashed with bcrypt server-side; never stored or logged in clear.
      example:
        email: ada@streampulse.local
        username: ada
        password: correct-horse-battery-staple

    UpdateProfileRequest:
      type: object
      required: [email, username]
      properties:
        email: { type: string, format: email }
        username: { type: string, minLength: 3, maxLength: 30 }
      example:
        email: ada@streampulse.local
        username: ada

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    OAuthLoginRequest:
      type: object
      required: [provider, id_token]
      properties:
        provider:
          type: string
          enum: [google, apple]
        id_token:
          type: string
          description: Signed ID token returned by the provider's SDK on the device.
      example:
        provider: google
        id_token: eyJhbGciOiJSUzI1NiIs…

    Stream:
      type: object
      required: [id, title, owner_id, status, listener_count, format, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        owner_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/StreamStatus' }
        listener_count:
          type: integer
          description: Persisted counter, refreshed on connect/disconnect. For a live snapshot use `/streams/{id}/listeners`.
        format:
          type: string
          description: Declared audio format. Stored, but not yet used to transcode.
          example: mp3
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateStreamRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        format: { type: string, example: mp3 }

    UpdateStreamRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }

    ListenerInfo:
      type: object
      required: [client_id, user_id, username]
      properties:
        client_id:
          type: string
          format: uuid
          description: One per connection — the same user listening twice appears twice.
        user_id: { type: string, format: uuid }
        username: { type: string }

    Music:
      type: object
      required: [id, title, artist, duration, url, uploaded_by, created_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        artist: { type: string }
        album: { type: string }
        duration:
          type: integer
          description: Seconds.
        url:
          type: string
          description: Absolute URL, or a `/uploads/…` path when the file was uploaded to this server.
        cover_url: { type: string }
        uploaded_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    AddMusicURLRequest:
      type: object
      required: [title, url]
      properties:
        title: { type: string }
        artist: { type: string }
        album: { type: string }
        duration: { type: integer, description: Seconds. }
        url: { type: string, format: uri }

    UpdateMusicRequest:
      type: object
      properties:
        title: { type: string }
        artist: { type: string }
        album: { type: string }
        cover_url: { type: string }

    SearchResult:
      type: object
      required: [streams, music]
      properties:
        streams:
          type: array
          items: { $ref: '#/components/schemas/Stream' }
        music:
          type: array
          items: { $ref: '#/components/schemas/Music' }

    Track:
      type: object
      required: [id, title, url, duration, position]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        url: { type: string }
        duration: { type: integer, description: Seconds. }
        position:
          type: integer
          description: 0-based rank in the queue. Rewritten by `PUT /playlists/{id}/tracks`.

    Playlist:
      type: object
      required: [id, name, owner_id, is_public, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        owner_id: { type: string, format: uuid }
        owner_username:
          type: string
          description: Only set on `GET /playlists/public`, where the owner isn't necessarily the caller.
        is_public:
          type: boolean
          description: A public playlist is readable by any authenticated user; only the owner can write.
        tracks:
          type: array
          description: Ordered by `position`. Omitted on list endpoints.
          items: { $ref: '#/components/schemas/Track' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreatePlaylistRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        is_public: { type: boolean, default: false }

    UpdatePlaylistRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        is_public: { type: boolean }

    AddTrackRequest:
      type: object
      required: [title, url]
      properties:
        title: { type: string }
        url: { type: string }
        duration: { type: integer, description: Seconds. }

    ReorderTracksRequest:
      type: object
      required: [track_ids]
      properties:
        track_ids:
          type: array
          description: Every track of the playlist, exactly once, in the desired order.
          items: { type: string, format: uuid }
      example:
        track_ids:
          - 9b2f4c1e-0000-4000-8000-000000000001
          - 9b2f4c1e-0000-4000-8000-000000000003
          - 9b2f4c1e-0000-4000-8000-000000000002

    TokenEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/TokenPair' }

    StreamEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Stream' }

    StreamListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Stream' }

    MusicEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Music' }

    MusicListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Music' }

    PlaylistEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Playlist' }

    PlaylistListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Playlist' }

    ProfileEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Profile' }

    UserListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/User' }

    FeedbackType:
      type: string
      enum: [bug, suggestion, other]

    FeedbackStatus:
      type: string
      description: Processing lifecycle, moved forward by an admin.
      enum: [new, in_progress, resolved]

    SubmitFeedbackRequest:
      type: object
      required: [type, message]
      properties:
        type: { $ref: '#/components/schemas/FeedbackType' }
        message:
          type: string
          maxLength: 4000
        app_version:
          type: string
          description: e.g. `pubspec.yaml` version, so a report can be tied to a build.
        platform:
          type: string
          description: e.g. `android`, `ios`, `web`.

    Feedback:
      type: object
      required: [id, user_id, type, message, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/FeedbackType' }
        message: { type: string }
        app_version: { type: string }
        platform: { type: string }
        status: { $ref: '#/components/schemas/FeedbackStatus' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FeedbackEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Feedback' }

    FeedbackListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Feedback' }
